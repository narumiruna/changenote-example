name: Publication preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: changenote/action/setup@b0fcdb183debdd058cd2298dec830c2caa5354e6
        id: cli
        with:
          version: 'v0.9.2'
      - id: preview
        uses: changenote/action/select@b0fcdb183debdd058cd2298dec830c2caa5354e6
        with:
          cli-path: ${{ steps.cli.outputs.cli-path }}
          base-branch: main
