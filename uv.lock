version = 1
revision = 5
requires-python = ">=3.14"

[manifest]
members = [
    "changenote-example",
    "pkg-python",
]

[[package]]
name = "changenote-example"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "pkg-python" },
]

[package.metadata]
requires-dist = [{ name = "pkg-python", editable = "packages/pkg-python" }]

[[package]]
name = "pkg-python"
version = "0.1.0"
source = { editable = "packages/pkg-python" }
